<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AI Opinion · Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600&display=swap">
<style>
:root{
  color-scheme:light;
  /* tokens al estilo shadcn/ui, con la identidad de AI Opinion */
  --background:#F6F5FB; --foreground:#293D5B; --card:#FFFFFF; --card-foreground:#293D5B;
  --border:#E5E2DF; --muted-foreground:#7B8497; --primary:#655DF0; --green:#19C58A; --yellow:#F4BA40; --orange:#FF6A3D; --gray:#A7A8B3;
  --radius:16px; box-sizing:border-box;
}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--background);color:var(--foreground);font-family:'Outfit','Poppins',system-ui,sans-serif;-webkit-font-smoothing:antialiased;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
.wrap{max-width:1180px;margin:0 auto;padding:28px 20px 48px}
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:24px}
.brand{display:flex;align-items:center;gap:14px}
.logo{width:44px;height:44px;border-radius:14px;background:var(--primary);display:grid;place-items:center;color:#fff;font-weight:600;font-size:17px}
h1{margin:0;font-size:24px;font-weight:600;letter-spacing:-.2px}
.upd{font-size:14px;color:var(--muted-foreground);margin-top:2px}
.btn{height:44px;padding:0 22px;border-radius:99px;border:0;background:var(--green);color:#fff;font:500 15px 'Outfit','Poppins',sans-serif;cursor:pointer;display:inline-flex;align-items:center;gap:8px}
.btn[disabled]{opacity:.6;cursor:wait}
.btn:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}
.spin{animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
/* shadcn/ui Card */
.card{border-radius:var(--radius);border:1px solid var(--border);background:var(--card);color:var(--card-foreground);box-shadow:0 1px 2px rgba(41,61,91,.06)}
.card-header{display:flex;flex-direction:column;gap:6px;padding:20px 22px 0}
.card-title{font-size:15px;font-weight:500;color:var(--muted-foreground);margin:0;line-height:1.2}
.card-description{font-size:14px;color:var(--muted-foreground);margin:0}
.card-content{padding:12px 22px 22px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:16px}
.big{font-size:36px;font-weight:600;line-height:1.1;letter-spacing:-.5px}
.big.sm{font-size:26px;line-height:1.2}
.note{font-size:14px;color:var(--muted-foreground);margin-top:6px}
.grades{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.g{border:1.5px solid var(--border);border-radius:99px;text-align:center;padding:6px 0;font-size:14px;color:var(--muted-foreground)}
.g b{color:var(--foreground);font-weight:600;margin-left:4px}
.charts{display:grid;grid-template-columns:5fr 7fr;gap:16px;margin-bottom:16px}
.chart{height:300px}
.legend{display:flex;flex-direction:column;gap:8px;margin-top:6px}
.legend div{display:flex;align-items:center;gap:10px;font-size:15px}
.dot{width:12px;height:12px;border-radius:50%;flex:none}
.legend span.p{margin-left:auto;font-weight:600}
.donut-row{display:flex;flex-direction:column}
.tablebox{overflow-x:auto;max-height:460px;overflow-y:auto}
table{width:100%;border-collapse:collapse;font-size:15px;min-width:640px}
th{position:sticky;top:0;background:var(--card);text-align:left;font-weight:500;color:var(--muted-foreground);font-size:14px;padding:10px 12px;border-bottom:1px solid var(--border)}
td{padding:12px;border-bottom:1px solid #F0EEEB}
tr:last-child td{border-bottom:0}
.pill{display:inline-block;padding:3px 12px;border-radius:99px;font-size:13px;font-weight:500}
.empty,.error{padding:28px 8px;text-align:center;color:var(--muted-foreground)}
.error{color:#C93A3F}
@media (max-width:1000px){.stats{grid-template-columns:repeat(2,1fr)}.charts{grid-template-columns:1fr}}
@media (max-width:520px){.stats{grid-template-columns:1fr}.wrap{padding:20px 14px 40px}.big{font-size:32px}}
</style>
<script>
function showErr(t){var d=document.getElementById('diag');if(d)d.innerHTML='<div style="max-width:620px;margin:40px auto;padding:20px 24px;font-family:sans-serif;font-size:16px;line-height:1.4;color:#C93A3F;background:#fff;border-radius:16px;border:1px solid #E5E2DF">'+t+'</div>'}
window.addEventListener('error',function(e){showErr('Error en la página: '+e.message)});
var LIBS=[
 ['React',['https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js','https://unpkg.com/react@18.3.1/umd/react.production.min.js','https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js']],
 ['ReactDOM',['https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js','https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js','https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js']],
 ['PropTypes',['https://cdn.jsdelivr.net/npm/prop-types@15.8.1/prop-types.min.js','https://unpkg.com/prop-types@15.8.1/prop-types.min.js']],
 ['ReactIs',['https://cdn.jsdelivr.net/npm/react-is@18.3.1/umd/react-is.production.min.js','https://unpkg.com/react-is@18.3.1/umd/react-is.production.min.js']],
 ['Recharts',['https://cdn.jsdelivr.net/npm/recharts@2.12.7/umd/Recharts.js','https://unpkg.com/recharts@2.12.7/umd/Recharts.js']]
];
function loadScript(src){return new Promise(function(ok,no){var s=document.createElement('script');s.src=src;s.onload=ok;s.onerror=function(){no(src)};document.head.appendChild(s)})}
async function loadAll(cb){
  for(var i=0;i<LIBS.length;i++){
    var name=LIBS[i][0],urls=LIBS[i][1],done=false;
    for(var j=0;j<urls.length&&!done;j++){try{await loadScript(urls[j]);done=true}catch(e){}}
    if(!done){showErr('No se pudo cargar la librería <b>'+name+'</b>. Es probable que tu red o tu navegador estén bloqueando los CDN (jsdelivr, unpkg). Prueba con otra red (datos del celular) o desactiva el bloqueador de anuncios, y recarga.');return}
  }
  if(typeof Recharts==='undefined'||!Recharts.PieChart){showErr('Recharts se descargó pero no se inició. Abre la consola (F12) y envíame el mensaje.');return}
  cb();
}
</script>
</head>
<body>
<div id="diag"></div>
<div id="root"></div>
<script>
function main(){
/* Claves públicas (seguras para el frontend). Los datos salen SOLO de Supabase. */
const SUPABASE_URL='https://usdwbqmtpomusrgyrsph.supabase.co';
const SUPABASE_KEY='sb_publishable_ab8M0Mb_L0XUjyzZVgBSwg_QmHz_-Y1';

const {useState,useEffect,useMemo,useCallback,forwardRef,createElement:h}=React;
const {PieChart,Pie,Cell,ResponsiveContainer,BarChart,Bar,XAxis,YAxis,CartesianGrid,Tooltip,Legend}=Recharts;

/* ---- shadcn/ui: componente Card (código del componente, adaptado a CSS plano) ---- */
const cn=(...c)=>c.filter(Boolean).join(' ');
const Card=forwardRef(({className,...p},ref)=>h('div',{ref,className:cn('card',className),...p}));
const CardHeader=forwardRef(({className,...p},ref)=>h('div',{ref,className:cn('card-header',className),...p}));
const CardTitle=forwardRef(({className,...p},ref)=>h('h3',{ref,className:cn('card-title',className),...p}));
const CardDescription=forwardRef(({className,...p},ref)=>h('p',{ref,className:cn('card-description',className),...p}));
const CardContent=forwardRef(({className,...p},ref)=>h('div',{ref,className:cn('card-content',className),...p}));

const L={
  opinion:{a_favor:'A favor',en_contra:'En contra',neutral:'Neutral'},
  know:{mucho:'Mucho',suficiente:'Lo suficiente',poco:'Poco',nada:'Nada'},
  interest:{educacion:'Educación',tecnologia:'Tecnología',medicina:'Medicina',entretenimiento:'Entretenimiento',trabajo:'Trabajo'}
};
const OP_COL={a_favor:'#19C58A',en_contra:'#FF6A3D',neutral:'#F4BA40'};
const KN_COL={mucho:'#19C58A',suficiente:'#655DF0',poco:'#F4BA40',nada:'#A7A8B3'};
const GRADES=[7,8,9,10,11,12];
const pct=(n,t)=>t?Math.round(n*1000/t)/10:0;

function compute(rows){
  const total=rows.length;
  const avg=total?rows.reduce((s,r)=>s+r.age,0)/total:null;
  const count=(key)=>rows.reduce((a,r)=>(a[r[key]]=(a[r[key]]||0)+1,a),{});
  const int=count('main_interest'), top=Math.max(0,...Object.values(int));
  const topNames=Object.keys(int).filter(k=>int[k]===top).map(k=>L.interest[k]);
  const byGrade=GRADES.map(g=>({g,n:rows.filter(r=>r.grade===g).length}));
  const op=count('ai_opinion');
  const donut=Object.keys(L.opinion).map(k=>({key:k,name:L.opinion[k],value:op[k]||0}));
  const bars=GRADES.map(g=>{
    const o={grado:g+'.º'}; const sub=rows.filter(r=>r.grade===g);
    Object.keys(L.know).forEach(k=>o[k]=sub.filter(r=>r.ai_knowledge===k).length);
    return o;
  });
  return {total,avg,topNames,top,byGrade,donut,bars};
}

function App(){
  const [rows,setRows]=useState(null), [err,setErr]=useState(null), [loading,setLoading]=useState(false), [at,setAt]=useState(null);
  const load=useCallback(async()=>{
    setLoading(true); setErr(null);
    try{
      const url=`${SUPABASE_URL}/rest/v1/survey_responses?select=id,alias,age,grade,main_interest,ai_opinion,ai_knowledge,created_at&order=created_at.desc&limit=1000`;
      const r=await fetch(url,{headers:{apikey:SUPABASE_KEY,Authorization:`Bearer ${SUPABASE_KEY}`}});
      if(!r.ok){console.error('Supabase',r.status,await r.text());throw new Error('http '+r.status)}
      setRows(await r.json()); setAt(new Date());
    }catch(e){setErr('No se pudieron cargar los datos. Revisa tu conexión y pulsa Actualizar.')}
    finally{setLoading(false)}
  },[]);
  useEffect(()=>{load()},[load]);
  const s=useMemo(()=>rows?compute(rows):null,[rows]);
  const fmt=d=>new Date(d).toLocaleString('es-MX',{dateStyle:'medium',timeStyle:'short'});

  const refresh=h('button',{className:'btn',onClick:load,disabled:loading},
    h('svg',{className:loading?'spin':'',width:18,height:18,viewBox:'0 0 24 24',fill:'none',stroke:'currentColor',strokeWidth:2.4,strokeLinecap:'round',strokeLinejoin:'round'},h('path',{d:'M21 12a9 9 0 1 1-3-6.7L21 8M21 3v5h-5'})),
    loading?'Actualizando…':'Actualizar datos');

  const top=h('div',{className:'top'},
    h('div',{className:'brand'},h('div',{className:'logo'},'AI'),
      h('div',null,h('h1',null,'AI Opinion Dashboard'),h('div',{className:'upd'},at?'Actualizado '+fmt(at):'Cargando datos…'))),
    refresh);

  if(err&&!rows)return h('div',{className:'wrap'},top,h(Card,null,h('div',{className:'error'},err)));
  if(!rows)return h('div',{className:'wrap'},top,h(Card,null,h('div',{className:'empty'},'Cargando respuestas desde Supabase…')));

  const stat=(title,val,note,cls)=>h(Card,null,h(CardHeader,null,h(CardTitle,null,title)),h(CardContent,null,h('div',{className:'big '+(cls||'')},val),note&&h('div',{className:'note'},note)));

  const cards=h('div',{className:'stats'},
    stat('Total de respuestas',s.total,'estudiantes'),
    stat('Promedio de edad',s.avg===null?'—':s.avg.toFixed(1),s.avg===null?'sin datos':'años'),
    stat('Categoría más común',s.total?s.topNames.join(' y '):'—',s.total?(s.topNames.length>1?'empate, ':'')+s.top+' respuesta'+(s.top===1?'':'s')+' cada una':'sin datos','sm'),
    h(Card,null,h(CardHeader,null,h(CardTitle,null,'Registros por grado escolar')),
      h(CardContent,null,h('div',{className:'grades'},s.byGrade.map(x=>h('div',{className:'g',key:x.g},x.g+'.º',h('b',null,x.n))))))
  );

  const donut=h(Card,null,h(CardHeader,null,h(CardTitle,null,'Opinión sobre la IA'),h(CardDescription,null,'Porcentaje de estudiantes')),
    h(CardContent,{className:'donut-row'},
      s.total===0?h('div',{className:'empty'},'Aún no hay respuestas.'):
      h(React.Fragment,null,
        h('div',{style:{height:200}},h(ResponsiveContainer,{width:'100%',height:'100%'},
          h(PieChart,null,h(Pie,{data:s.donut,dataKey:'value',nameKey:'name',innerRadius:58,outerRadius:90,paddingAngle:s.donut.filter(d=>d.value).length>1?3:0,stroke:'none'},
            s.donut.map(d=>h(Cell,{key:d.key,fill:OP_COL[d.key]}))),
            h(Tooltip,{formatter:(v,n)=>[v+' ('+pct(v,s.total)+' %)',n]})))),
        h('div',{className:'legend'},s.donut.map(d=>h('div',{key:d.key},h('i',{className:'dot',style:{background:OP_COL[d.key]}}),d.name,h('span',{className:'p'},pct(d.value,s.total)+' %')))))));

  const bar=h(Card,null,h(CardHeader,null,h(CardTitle,null,'Conocimiento de IA por grado'),h(CardDescription,null,'Número de estudiantes por nivel')),
    h(CardContent,null,s.total===0?h('div',{className:'empty'},'Aún no hay respuestas.'):
      h('div',{className:'chart'},h(ResponsiveContainer,{width:'100%',height:'100%'},
        h(BarChart,{data:s.bars,margin:{top:8,right:4,left:-20,bottom:0}},
          h(CartesianGrid,{strokeDasharray:'3 3',vertical:false,stroke:'#EDEBF3'}),
          h(XAxis,{dataKey:'grado',tickLine:false,axisLine:false,tick:{fill:'#7B8497',fontSize:13}}),
          h(YAxis,{allowDecimals:false,tickLine:false,axisLine:false,tick:{fill:'#7B8497',fontSize:13}}),
          h(Tooltip,{cursor:{fill:'#F6F5FB'}}),
          h(Legend,{iconType:'circle',wrapperStyle:{fontSize:13}}),
          Object.keys(L.know).map(k=>h(Bar,{key:k,dataKey:k,name:L.know[k],fill:KN_COL[k],radius:[4,4,0,0]})))))));

  const table=h(Card,null,h(CardHeader,null,h(CardTitle,null,'Registros'),h(CardDescription,null,s.total+' respuesta'+(s.total===1?'':'s')+', las más recientes primero')),
    h(CardContent,null,s.total===0?h('div',{className:'empty'},'Aún no hay respuestas.'):
      h('div',{className:'tablebox'},h('table',null,
        h('thead',null,h('tr',null,['Alias','Edad','Grado','Opinión','Nivel de conocimiento','Fecha de registro'].map(t=>h('th',{key:t},t)))),
        h('tbody',null,rows.map(r=>h('tr',{key:r.id},
          h('td',null,r.alias),h('td',null,r.age),h('td',null,r.grade+'.º'),
          h('td',null,h('span',{className:'pill',style:{background:OP_COL[r.ai_opinion]+'26',color:'#293D5B'}},L.opinion[r.ai_opinion])),
          h('td',null,L.know[r.ai_knowledge]),h('td',null,fmt(r.created_at)))))))));

  return h('div',{className:'wrap'},top,err&&h('div',{className:'error',style:{padding:'0 0 14px',textAlign:'left'}},err),cards,h('div',{className:'charts'},donut,bar),table);
}
ReactDOM.createRoot(document.getElementById('root')).render(h(App));
}
loadAll(main);
</script>
</body>
</html>
